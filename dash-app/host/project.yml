name: DSHarness
options:
  bundleIdPrefix: io.wenbo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
  configs:
    # Debug 产物与 Release 区分：不同名字/bundle id/图标，两版本可并存。
    Debug:
      PRODUCT_NAME: DSHarness Dev
      PRODUCT_BUNDLE_IDENTIFIER: io.wenbo.dsharness.dev
      APP_ICON_NAME: AppIconDev
    Release:
      PRODUCT_NAME: DeepSeek Harness
      PRODUCT_BUNDLE_IDENTIFIER: io.wenbo.dsharness
      APP_ICON_NAME: AppIcon
packages:
  DSHKit:
    path: Packages/DSHKit
  DSHSidebarUI:
    path: Packages/DSHSidebarUI
targets:
  DSHarness:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "DSHarness.entitlements"
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: minimal
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    preBuildScripts:
      # 构建时间戳写入 Resources/BuildTimestamp.txt，Dev UI 显示用。
      - script: scripts/write-build-timestamp.sh
    dependencies:
      - package: DSHKit
      - package: DSHSidebarUI
    entitlements:
      path: Sources/DSHarness.entitlements
      properties:
        com.apple.security.app-sandbox: false
