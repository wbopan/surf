# dash-app 的 bundle patch 层：
# `dsh plugin --profile web add link:<repo>/dash-app` 之后 reconcile 会把包名写进
# dsh.profile.bundles，本文件随之作为一个 patch 层生效——插入自己这一行。
# 用户 profile 的 cordis.patch.yml 在其后，可覆盖这里的 config。
- insert:
    - id: dash-app
      name: dash-app
      config:
        # 构建哪个配置。Debug 产物是 "dash Dev.app"（bundle id io.wenbo.dash.dev），
        # Release 是 "dash.app"——两者可并存运行。开发期默认 Debug；
        # 日常使用者应在自己的 profile patch 里覆写成 Release。
        configuration: Debug
        # 源码变了就重建（无 Xcode 时自动降级为"只探测既有产物"）。
        build: true
        # 构建/探测到产物后自动拉起（已在运行则跳过）。
        launch: true
        # dsh 运行期间盯着壳源码，改了就后台重建，经桥提示「有新版，重启生效」。
        watch: true
        # 重建成功后不等用户点，直接让壳退出并重拉。开发期图省事可以打开，
        # 代价是每次改壳源码都会丢掉页面状态（滚动位置、输入框里没发出去的字）。
        restartOnRebuild: false
