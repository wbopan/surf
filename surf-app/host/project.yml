name: surf
options:
  bundleIdPrefix: io.wenbo
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
  configs:
    # Debug 产物与 Release 区分：不同名字/bundle id/图标，两版本可并存。
    Debug:
      PRODUCT_NAME: Surf Dev
      PRODUCT_BUNDLE_IDENTIFIER: io.wenbo.surf.dev
      APP_ICON_NAME: AppIconDev
    Release:
      PRODUCT_NAME: Surf
      PRODUCT_BUNDLE_IDENTIFIER: io.wenbo.surf
      APP_ICON_NAME: AppIcon
# 没有 SwiftPM 包了：SurfSDK 由 scripts/build-modules.sh 编成共享 dylib 随 bundle
# 分发（壳和插件链接同一份，类型身份才对得上）；DSHSidebarUI 随 M6 整体迁进
# surf-sidebar/swift/，DSHKit 随 M10 整体退役（会话数据面搬进 node 半边）。
targets:
  surf:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "surf.entitlements"
          # SurfSDK 单独编成共享 dylib（见 scripts/build-modules.sh），
          # 不能同时被编进 app module，否则类型身份一分为二。
          - "SurfSDK"
      # Icon Composer 的 .icon（Xcode 26 起）取代了原来的两个 .icns：包里只有
      # icon.json + Assets/ 里的裸 SVG，圆角遮罩、受光渐变、玻璃高光全归系统在运行时渲染，
      # 我们一样都不画（画了反而会和系统的叠一层）。actool 顺带生成 .icns 给老系统兜底。
      # XcodeGen 认得这个包类型，整个目录丢进来即可（实测写不写 type: file，
      # 生成的 pbxproj 逐字相同）。
      - path: Icons
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        COMBINE_HIDPI_IMAGES: YES
        # 走 .icon 而不是 .icns：值取上面 configs 里按 Debug/Release 分好的 APP_ICON_NAME。
        ASSETCATALOG_COMPILER_APPICON_NAME: "$(APP_ICON_NAME)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # 共享 module（SurfSDK）：编译期找 .swiftmodule，链接期找 dylib，
        # 运行期按 @rpath 落到 Contents/Frameworks/ 里 embed-modules.sh 摆好的那一份。
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/build-sdk"
        OTHER_LDFLAGS: "$(inherited) -L$(SRCROOT)/build-sdk -lSurfSDK"
        SWIFT_STRICT_CONCURRENCY: minimal
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    preBuildScripts:
      # 构建时间戳写入 Resources/BuildTimestamp.txt，Dev UI 显示用。
      - script: scripts/write-build-timestamp.sh
        name: Write build timestamp
      # 共享 module（源码没变则秒过）。必须早于壳源码编译。
      - script: scripts/build-modules.sh
        name: Build shared modules (SurfSDK)
    postBuildScripts:
      # 下面三个脚本都往 bundle 里写文件，所以**每一个都必须声明 outputFiles**。
      #
      # 不声明的后果是间歇性的、而且正好砸在发布那一步（2026-08-30 实测复现）：
      # Xcode 的依赖图里没有这些文件，于是当壳的可执行文件本身没变时
      # （只改了插件的 node/swift 半边就是这种情况），**CodeSign 阶段被判定为
      # 不必重跑**——可脚本每一轮都跑、每一轮都改 bundle 内容，于是封印过期。
      # 症状是 `codesign -v` 报 `a sealed resource is missing or invalid`
      # 并点名那个 JSON，而 `BUILD SUCCEEDED` 一切正常。**公证会直接拒收这种包。**
      #
      # 声明代表性产物（各自的 manifest / 主产物）就够了：Xcode 只需要知道
      # "这个阶段会产出它"，就会把 CodeSign 排到它后面并跟着它的新鲜度走。
      # Debug 配置下后两个脚本直接 exit 0、不产出文件，output 缺失会让 Xcode
      # 每轮都调用它们——正是想要的（它们自己两行就退出了）。

      # 把共享 module 摆进 bundle 并重新签名。
      - script: scripts/embed-modules.sh
        name: Embed shared modules
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Frameworks/libSurfSDK.dylib

      # 分发载荷（node 半边 + Swift 源码 + 版本对齐）。**只在 Release 跑**，
      # Debug 直接 exit 0，开发循环耗时不变。排在 embed-modules 之后：Xcode 自己的
      # CodeSign 阶段在全部 postBuildScripts 之后才封外层 bundle（计划 §4.1），
      # 所以这一步不破封印、不需要重签。
      - script: scripts/pack-payload.sh
        name: Pack distribution payload
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/SurfPayload.json

      # 预编译各插件的 Swift 半边（M3，计划 §3.2）。**只在 Release 跑**。
      # 排在 pack-payload 之后：源码从刚打好的 Resources/SurfNode/<pkg>/swift/ 读，
      # "编的就是发的"因此是结构性的。用户机器上因此一次 swiftc 都不用跑。
      - script: scripts/prebuild-plugins.sh
        name: Prebuild native plugins
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/SurfPrebuilt.json
    # **entitlements 只能改在这里**：下面这张 properties 表是唯一真相，
    # `xcodegen generate` 每次都会照它重写 `Sources/surf.entitlements`——
    # 手改那个文件是静默丢失的（计划 §4.3）。
    #
    # **只有一份文件，Debug / 分发的差别由注入决定**（M5 定案，见计划 §4.3）：
    # `get-task-allow` 从来不写在这里，它是 `CODE_SIGN_INJECT_BASE_ENTITLEMENTS`
    # 在身份为 `-`（Sign to Run Locally）时替我们注入的。开发形态照旧拿得到它
    # （能挂调试器），分发形态由 `scripts/release-dmg.sh` 传
    # `CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO` 摘掉——**公证对 get-task-allow 是
    # 直接拒绝**。维护两份内容相同、只差一个注入项的 plist 只会让它们互相漂移。
    entitlements:
      path: Sources/surf.entitlements
      properties:
        # 不开启沙盒：需要 spawn Node 子进程并读写 Application Support。
        com.apple.security.app-sandbox: false
        # **热插件机制的存亡所系**（计划 §4.3）。分发形态要开 Hardened Runtime
        # （公证的前提），而 Hardened Runtime 默认打开 library validation：
        # dyld 会拒绝 dlopen **不是同一 Team ID 签名**的 dylib，而壳在用户机器上
        # 用 swiftc 现编出来的插件正是这种（linker 给的 ad-hoc 签名）。
        # 缺了它的症状是**所有现场编译的插件装载失败**，且完全不像签名问题。
        # 开发形态（ad-hoc、Hardened Runtime 关）多这一条无害。
        com.apple.security.cs.disable-library-validation: true
