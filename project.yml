name: DSHarness
options:
  bundleIdPrefix: io.wenbo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  DSHKit:
    path: Packages/DSHKit
  DSHSidebarUI:
    path: Packages/DSHSidebarUI
targets:
  DSHarness:
    type: application
    platform: macOS
    sources:
      - path: DSHarness
        excludes:
          - "Info.plist"
          - "DSHarness.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wenbo.dsharness
        PRODUCT_NAME: DeepSeek Harness
        INFOPLIST_FILE: DSHarness/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: minimal
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    dependencies:
      - package: DSHKit
      - package: DSHSidebarUI
    entitlements:
      path: DSHarness/DSHarness.entitlements
      properties:
        com.apple.security.app-sandbox: false
