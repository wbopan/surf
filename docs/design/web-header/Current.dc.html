<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #4176e6; } a:hover { color: #2f5fc4; }
    .glass { background: rgba(252,252,252,0.53); box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.197), inset 0 0.5px 0 rgba(255,255,255,0.8), 0 1px 2px rgba(0,0,0,0.05); }
  </style>
</helmet>
<div style="width: 1100px; height: 200px; background: #ffffff; position: relative; overflow: hidden; display: flex; flex-direction: row;">

  <!-- 原生侧边栏（参照物）：256pt，标题栏 52pt，两枚 36×36 玻璃胶囊 -->
  <div style="width: 256px; height: 200px; background: #fafafa; border-right: 1px solid rgba(0,0,0,0.1); box-sizing: border-box; position: relative; flex: none;">
    <div style="position: absolute; left: 18px; top: 19px; display: flex; gap: 8px;">
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12);"></div>
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12);"></div>
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #28c840; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12);"></div>
    </div>
    <div style="position: absolute; right: 8px; top: 8px; display: flex; gap: 8px;">
      <div class="glass" style="width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#363636" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h10M3 8h10M3 11.5h10"></path></svg>
      </div>
      <div class="glass" style="width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#363636" stroke-width="1.6" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="2"></rect><path d="M6 3v10"></path></svg>
      </div>
    </div>
    <div style="position: absolute; left: 10px; right: 10px; top: 64px; height: 36px; border-radius: 18px; background: rgba(0,0,0,0.06); display: flex; align-items: center; padding: 0 12px; box-sizing: border-box; gap: 6px; color: #81858c; font-size: 15px;">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#81858c" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
      <span>搜索</span>
    </div>
  </div>

  <!-- 现状 web header：dsh 0.1.1-rc.2 原样（padding 12 28 0 20，标题行 32，标签行下沉） -->
  <div style="flex: 1; min-width: 0; position: relative;">
    <div style="padding: 12px 28px 0 20px; position: relative; border-bottom: 1px solid rgba(0,0,0,0.1);">
      <div style="display: flex; align-items: center; min-height: 32px; gap: 0;">
        <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;">
          <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #0f1115; padding: 4px 8px;">hi</span>
          <span style="display: inline-flex; align-items: center; gap: 4px; height: 22px; font-size: 12px; line-height: 22px; color: #61666b; padding-right: 2px;">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#61666b" stroke-width="1.4" stroke-linejoin="round"><path d="M8 2l5 3v6l-5 3-5-3V5z M8 8l5-3M8 8L3 5M8 8v6"></path></svg>
            <span>标准模式</span>
          </span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; margin-left: 20px; flex: none;">
          <span style="display: inline-flex; align-items: center; gap: 4px; min-width: 111px; height: 32px; box-sizing: border-box; padding: 6px 12px; border: 1px solid rgba(0,0,0,0.1); border-radius: 18px; font-size: 13px; line-height: 20px; color: #0f1115; justify-content: center;">
            <span>Session log</span>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#0f1115" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v4a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V9M8 2v8M5 7l3 3 3-3"></path></svg>
          </span>
        </div>
      </div>
      <div style="display: flex; gap: 36px; margin-top: 4px; padding-left: 8px; position: relative; z-index: 1;">
        <span style="position: relative; font-size: 13px; line-height: 16px; font-weight: 500; color: #4176e6; padding: 0 0 11px;">对话<span style="position: absolute; left: 0; right: 0; bottom: 1px; height: 2px; border-radius: 2px; background: #4176e6;"></span></span>
        <span style="font-size: 13px; line-height: 16px; font-weight: 500; color: #81858c; padding: 0 0 11px;">轨迹</span>
      </div>
    </div>

    <!-- 内容切片 -->
    <div style="padding: 24px 100px 0 100px; display: flex; flex-direction: column; gap: 18px; font-size: 15px; color: #0f1115;">
      <div style="display: flex; justify-content: flex-end;">
        <span style="background: #e8f0fe; border-radius: 18px; padding: 8px 16px; line-height: 20px;">hi</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; color: #81858c; font-size: 14px;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#81858c" stroke-width="1.4"><rect x="3" y="2" width="10" height="12" rx="1.5"></rect><path d="M6 6h4M6 9h4"></path></svg>
        <span>上下文注入 · AGENTS.md</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
