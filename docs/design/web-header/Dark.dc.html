<!doctype html>

      <div class="glass" style="height: 36px; border-radius: 18px; padding: 0 10px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; gap: 5px; color: rgba(255,255,255,0.96);">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,0.96)" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="3.5" r="1.8"></circle><circle cx="3.5" cy="12.5" r="1.8"></circle><circle cx="12.5" cy="12.5" r="1.8"></circle><path d="M7 5.2L4.4 10.8M9 5.2l2.6 5.6M5.3 12.5h5.4"></path></svg>

    <div style="padding: 24px 100px 0 100px; display: flex; flex-direction: column; gap: 18px; font-size: 15px; color: #f9fafb;">
      <div style="display: flex; justify-content: flex-end;">
        <span style="background: rgba(103,158,254,0.18); border-radius: 18px; padding: 8px 16px; line-height: 20px;">hi</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; color: #adb2b8; font-size: 14px;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#adb2b8" stroke-width="1.4"><rect x="3" y="2" width="10" height="12" rx="1.5"></rect><path d="M6 6h4M6 9h4"></path></svg>
        <span>上下文注入 · AGENTS.md</span>
