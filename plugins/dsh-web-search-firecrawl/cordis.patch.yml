# dsh-web-search-firecrawl bundle patch layer.
# When this package is installed into a profile's dsh.profile.bundles, this file is
# applied as a patch layer that inserts the Firecrawl search-provider row.
- insert:
    - id: web-search-firecrawl
      name: dsh-web-search-firecrawl
      config:
        apiKeyEnv: FIRECRAWL_API_KEY
        baseURL: https://api.firecrawl.dev
        maxResults: 8
        timeoutMs: 30000
